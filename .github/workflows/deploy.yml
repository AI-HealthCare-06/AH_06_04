name: deploy

# GlowPass 운영 배포 (AWS 서울) — Actions 탭에서 [Run workflow] 버튼으로만 시작한다.
# 시작할 때 "전체 테스트를 3회 이상 했습니까?" 를 묻는다. '예'를 고른 사람의 답을 그대로 믿고 배포한다.
# '아니요'(기본값)면 배포하지 않는다. 누가 '예'라고 답했는지는 실행 기록(요약)에 남는다.
#
# 배포 길: GitHub → ECR(서울)에 이미지 올림 → 직원 통로(EC2 Instance Connect Endpoint)로 EC2 접속
#          → docker compose 로 fastapi·chatbot 교체 → 운영 주소 확인 → 실패하면 바로 앞 버전으로 되돌림
# 필요한 설정값(Settings → Secrets and variables → Actions)은 자동배포/README.md 3절에 있다.
# 공개 레포라 실행 기록도 공개된다 → 서버 ID 는 Secret 으로 두고, AWS 계정 ID 는 기록에서 가린다.
on:
  workflow_dispatch:
    inputs:
      tested_3_times:
        description: '⚠️ 지금 코드로 전체 테스트를 3회 이상 했습니까? (본인 답을 믿고 배포합니다)'
        required: true
        type: choice
        default: '아니요'
        options:
          - '아니요'
          - '예 — 전체 테스트를 3회 이상 했습니다'

# 배포가 겹치지 않게 한 번에 하나씩 돌린다
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  # 1단계: 질문에 '예'라고 답했는지만 본다 (횟수는 따지지 않는다 — 사람을 믿는다)
  confirm:
    name: 테스트 3회 확인
    runs-on: ubuntu-latest
    steps:
      - name: 테스트 3회 이상 했는지 확인
        env:
          ANSWER: ${{ inputs.tested_3_times }}
          ACTOR: ${{ github.actor }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::main 브랜치에서만 배포합니다 (지금: $SOURCE_REF)."
            exit 1
          fi
          if [[ "$ANSWER" != "예 — 전체 테스트를 3회 이상 했습니다" ]]; then
            echo "::error::배포하지 않았습니다. 전체 테스트를 3회 이상 한 뒤 다시 실행하고 '예'를 고르세요."
            {
              echo "## ⛔ 배포하지 않음"
              echo "- 답: **${ANSWER}**"
              echo "- 전체 테스트를 **3회 이상** 한 뒤 다시 실행하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## ✅ 테스트 3회 이상 확인"
            echo "- **${ACTOR}** 님이 \"전체 테스트를 3회 이상 했습니다\" 라고 답하고 배포를 시작했습니다."
            echo "- 커밋: \`${GITHUB_SHA}\`"
            echo "- 시각(한국): $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "확인: ${ACTOR} 님이 테스트 3회 이상이라고 답함"

  # 2단계: 우리 AWS(서울)에 배포
  deploy:
    name: AWS 서울 배포
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}   # 기록에서 *** 로 가려진다
      DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR || '/home/ubuntu/project' }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://app-glowpass.aidosas.com' }}
      # 되돌리기는 이 실행이 바꾼 것만 (다시 실행하면 번호가 바뀐다)
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 설정값 확인
        env:
          # 값은 보지 않고 비었는지만 본다 (GitHub 이 로그에서 가린다)
          HAS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=0
          [[ "$HAS_KEY_ID" == "true" ]] || { echo "::error::비밀값 AWS_ACCESS_KEY_ID 가 비어 있습니다 (Settings → Secrets and variables → Actions → Secrets)."; missing=1; }
          [[ "$HAS_SECRET" == "true" ]] || { echo "::error::비밀값 AWS_SECRET_ACCESS_KEY 가 비어 있습니다 (Settings → Secrets and variables → Actions → Secrets)."; missing=1; }
          [[ -n "$EC2_INSTANCE_ID" ]] || { echo "::error::비밀값 EC2_INSTANCE_ID 가 비어 있습니다 (Settings → Secrets and variables → Actions → Secrets)."; missing=1; }
          [[ -n "$ECR_REPOSITORY" ]] || { echo "::error::변수 ECR_REPOSITORY 가 비어 있습니다 (Settings → Secrets and variables → Actions → Variables)."; missing=1; }
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9._/-]*$ ]] || { echo "::error::ECR_REPOSITORY 형식이 이상합니다."; missing=1; }
          [[ "$EC2_INSTANCE_ID" =~ ^(i-[0-9a-f]{8,17})?$ ]] || { echo "::error::비밀값 EC2_INSTANCE_ID 형식이 이상합니다 (i-로 시작)."; missing=1; }
          [[ "$DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::EC2_DEPLOY_DIR 은 / 로 시작하는 경로여야 합니다."; missing=1; }
          [[ "$HEALTH_URL" =~ ^https?://[A-Za-z0-9.:-]+/?$ ]] || { echo "::error::HEALTH_URL 은 https://주소 꼴이어야 합니다 (경로 없이)."; missing=1; }
          exit $missing

      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 배포 버전 정하기
        id: ver
        # 다시 실행(Re-run)해도 이름이 겹치지 않게 시도 번호까지 붙인다 (ECR 태그 덮어쓰기 금지 설정과 맞게)
        run: echo "version=gh${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 배포 전용 IAM 사용자 키 (권한은 README 의 최소 권한 정책만)
      - name: AWS 로그인
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # 계정 ID 를 기록에서 *** 로 가린다 (ECR 주소 안에도 들어 있다 · 기본값은 안 가림)
          mask-aws-account-id: true

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 이미지 이름은 운영 compose 와 같은 꼴: <레지스트리>/<레포>:app-<버전> · chatbot-<버전>
      - name: 앱(fastapi) 이미지 빌드·올리기
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:app-${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: 챗봇 이미지 빌드·올리기
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: chatbot
          file: chatbot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:chatbot-${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=chatbot
          cache-to: type=gha,mode=max,scope=chatbot

      # 키 파일 없이 접속: 1회용 키를 만들어 60초짜리로 EC2 에 넣고, 직원 통로(EICE)로 ssh 한다
      - name: 직원 통로(EICE) 접속 준비
        run: |
          key="$RUNNER_TEMP/eice_key"
          ssh-keygen -t ed25519 -N '' -q -f "$key"
          cat > "$RUNNER_TEMP/remote" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          aws ec2-instance-connect send-ssh-public-key \\
            --instance-id "$EC2_INSTANCE_ID" --instance-os-user ubuntu \\
            --ssh-public-key "file://$key.pub" > /dev/null
          exec ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \\
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \\
            -o ServerAliveInterval=30 \\
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id %h" \\
            "ubuntu@$EC2_INSTANCE_ID" "\$@"
          EOF
          chmod 700 "$RUNNER_TEMP/remote"
          # 서버 이름·내부 IP 는 공개 기록에 찍지 않는다
          "$RUNNER_TEMP/remote" 'echo "EC2 접속 성공"'

      - name: EC2 에서 ECR 로그인
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | "$RUNNER_TEMP/remote" "docker login --username AWS --password-stdin $(printf '%q' "$REGISTRY") > /dev/null && echo 'EC2 ECR 로그인 성공'"

      - name: EC2 에서 새 버전으로 교체
        id: remote_deploy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          "$RUNNER_TEMP/remote" "MODE=deploy RUN_ID=$RUN_ID DEPLOY_DIR=$(printf '%q' "$DEPLOY_DIR") REGISTRY=$(printf '%q' "$REGISTRY") REPOSITORY=$(printf '%q' "$ECR_REPOSITORY") VERSION=$(printf '%q' "$VERSION") bash -s" \
            < scripts/deploy/remote_deploy.sh

      - name: 운영 주소 확인
        id: health
        run: |
          # 횟수(최대 30번)와 시간(최대 4분) 중 먼저 닿는 쪽에서 멈춘다.
          # 앱이 죽어 있으면 응답이 늦게 오므로 한 번에 5초까지만 기다린다.
          HEALTH_URL="${HEALTH_URL%/}"   # 끝의 / 는 뗀다
          sleep 15
          deadline=$((SECONDS + 240))
          for i in $(seq 1 30); do
            # ?deploy=… : Cloudflare 같은 중간 캐시의 옛 200 응답에 속지 않게
            home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HEALTH_URL/?deploy=$RUN_ID-$i" || true)
            chat=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HEALTH_URL/api/v1/chat/langs?deploy=$RUN_ID-$i" || true)
            echo "확인 $i/30: 첫 화면 $home · 챗봇 $chat"
            if [[ "$home" == "200" && "$chat" == "200" ]]; then
              echo "운영 주소 정상"
              exit 0
            fi
            (( SECONDS < deadline )) || break
            sleep 5
          done
          echo "::error::운영 주소가 정상이 되지 않습니다. 바로 앞 버전으로 되돌립니다."
          exit 1

      - name: 실패 → 바로 앞 버전으로 되돌리기
        # 교체 단계가 실제로 돌았을 때만 (그 전에 실패했으면 서버는 그대로라 되돌릴 것이 없다)
        if: failure() && (steps.remote_deploy.outcome == 'success' || steps.remote_deploy.outcome == 'failure')
        run: |
          "$RUNNER_TEMP/remote" "MODE=rollback RUN_ID=$RUN_ID DEPLOY_DIR=$(printf '%q' "$DEPLOY_DIR") bash -s" < scripts/deploy/remote_deploy.sh
          echo "## ↩️ 배포 실패 → 앞 버전으로 되돌림" >> "$GITHUB_STEP_SUMMARY"

      - name: 안 쓰는 옛 이미지 정리
        if: success()
        run: |
          "$RUNNER_TEMP/remote" "MODE=cleanup RUN_ID=$RUN_ID DEPLOY_DIR=$(printf '%q' "$DEPLOY_DIR") bash -s" < scripts/deploy/remote_deploy.sh

      - name: 결과 요약
        if: success()
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## 🚀 배포 완료"
            echo "- 버전: \`${VERSION}\` (fastapi · chatbot)"
            echo "- 주소: ${HEALTH_URL}"
            echo "- 시각(한국): $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
