<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 밝은 화면 전용 디자인 — 휴대폰 다크 모드에서 브라우저가 색을 강제로 뒤집지 않게 (캐릭터·하늘색이 검정 바탕에 묻히던 것) -->
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#F5F0E8">
  <title>GlowPass</title>
  <!-- GlowPass 웹 화면 (한 페이지 앱) — 디자인 시안(GlowPass_UI_Design.pdf) 흐름을 따른다 -->
  <!-- 글꼴 v2: 본문 Pretendard · 제목 고운바탕(한) + Noto Serif(중·일) · 영문 로고 Cormorant Garamond — 못 받으면 기기 기본 글꼴로 그대로 보인다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><!-- #/ : 로그인 전이면 소개 영상 첫 화면, 로그인 후면 내 홈 -->
      <!-- 마크: 모카 원 안에 골드 물방울 선 (챗봇 답 옆 마크와 같은 그림) -->
      <svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="15" fill="#76594B"/>
        <path d="M15 5c5 6.5 7.5 10.3 7.5 13.3a7.5 7.5 0 01-15 0C7.5 15.3 10 11.5 15 5z" fill="none" stroke="#D6B77A" stroke-width="1.6"/>
        <circle cx="15" cy="18.5" r="2" fill="#D6B77A"/>
      </svg>GlowPass</a>
    <select id="lang" aria-label="language">
      <option value="ko">한국어</option>
      <!-- 순서: 2025년 외국인 환자 국적 순 (중국 61.9만 → 일본 60만, 보건복지부 2026.4 발표) -->
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </header>
  <!-- 의료진 감수 전 안내문으로 데모 운영 중일 때만 보인다 (GET /api/v1/service-info) -->
  <div id="demo-banner" class="demo-banner" role="note" data-i18n="demo_banner" hidden></div>
  <main id="view" aria-live="polite"></main>
  <footer class="footer" data-i18n="disclaimer_short"></footer>
  <script src="/static/i18n.js"></script>
  <script src="/static/clinic.js"></script>
  <script src="/static/hospitals.js"></script>
  <script src="/static/media.js"></script>
  <script src="/static/reminders.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
