<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 밝은 화면 전용 디자인 — 휴대폰 다크 모드에서 브라우저가 색을 강제로 뒤집지 않게 (캐릭터·하늘색이 검정 바탕에 묻히던 것) -->
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#FFFFFF">
  <title>GlowPass</title>
  <!-- GlowPass 웹 화면 (한 페이지 앱) — 디자인 시안(GlowPass_UI_Design.pdf) 흐름을 따른다 -->
  <!-- 디자인 시안 글꼴: 본문 Noto Sans KR · 제목 Jua (못 받으면 기본 글꼴로 그대로 보인다) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><!-- #/ : 로그인 전이면 소개 영상 첫 화면, 로그인 후면 내 홈 -->
      <!-- 물방울 캐릭터 (디자인 시안) -->
      <svg width="30" height="32" viewBox="0 0 120 130" aria-hidden="true">
        <ellipse cx="60" cy="72" rx="56" ry="52" fill="#E7F4FA"/>
        <path d="M60 14C90 54 100 76 100 92a40 40 0 01-80 0c0-16 10-38 40-78z" fill="#fff" stroke="#3E9FC7" stroke-width="6"/>
        <circle cx="46" cy="88" r="8" fill="#22343B"/><circle cx="49" cy="85" r="2.8" fill="#fff"/>
        <circle cx="74" cy="88" r="8" fill="#22343B"/><circle cx="77" cy="85" r="2.8" fill="#fff"/>
        <circle cx="38" cy="100" r="8" fill="#6FC9A6" opacity=".5"/><circle cx="82" cy="100" r="8" fill="#6FC9A6" opacity=".5"/>
        <path d="M50 104q10 9 20 0" stroke="#22343B" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>GlowPass</a>
    <select id="lang" aria-label="language">
      <option value="ko">한국어</option>
      <!-- 순서: 2025년 외국인 환자 국적 순 (중국 61.9만 → 일본 60만, 보건복지부 2026.4 발표) -->
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </header>
  <!-- 의료진 감수 전 안내문으로 데모 운영 중일 때만 보인다 (GET /api/v1/service-info) -->
  <div id="demo-banner" class="demo-banner" role="note" data-i18n="demo_banner" hidden></div>
  <main id="view" aria-live="polite"></main>
  <footer class="footer" data-i18n="disclaimer_short"></footer>
  <script src="/static/i18n.js"></script>
  <script src="/static/clinic.js"></script>
  <script src="/static/hospitals.js"></script>
  <script src="/static/media.js"></script>
  <script src="/static/reminders.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
