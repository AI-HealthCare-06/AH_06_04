<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlowPass 챗봇 실습 v2</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e5e7eb; --me:#2f6fed; --bot:#eef1f6; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  select, button, textarea { font: inherit; }
  select, textarea { border:1px solid var(--line); border-radius:8px; padding:8px; background:#fff; }
  button { border:0; border-radius:8px; padding:8px 14px; background:var(--me); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:default; }
  #log { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .msg { max-width: 85%; margin: 6px 0; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; line-height:1.5; }
  .user { margin-left:auto; background:var(--me); color:#fff; }
  .bot { background:var(--bot); }
  .bot.emergency { background:#fff4e5; border:1px solid var(--warn); }
  .bot.no_doc { background:#f3f4f6; border:1px dashed #9ca3af; }
  .src { font-size:12px; color:#2f6fed; margin:2px 0 0; }
  .bot.blocked, .bot.error, .bot.limit { background:#fdecec; border:1px solid var(--bad); }
  .notice { font-size:12px; color:var(--muted); margin:2px 0 10px; }
  .tag { font-size:11px; color:var(--muted); margin-left:4px; }
  form { display:flex; gap:8px; margin-top:8px; }
  textarea { flex:1; resize:none; height:52px; }
  #status { font-size:12px; color:var(--muted); margin-top:6px; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GlowPass 생활관리 챗봇 <span class="tag">실습 v2 · 안내문 근거</span></h1>
    <select id="lang" aria-label="언어"></select>
    <button class="ghost" id="newBtn" type="button">새 대화</button>
    <button class="ghost" id="delBtn" type="button">대화 지우기</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="q" maxlength="500" placeholder="예) 레이저 토닝 후 세안은 어떻게 해요?"></textarea>
    <button id="send" type="submit">보내기</button>
    <button id="stop" type="button" class="ghost" disabled>중지</button>
  </form>
  <div id="status"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const API = "/api/v1/chat";
let convId = null, ctl = null;

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;                       // textContent — 답을 HTML 로 해석하지 않는다 (XSS 방지)
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return d;
}
function note(text) {
  const d = document.createElement("div"); d.className = "notice"; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
function busy(on) { $("send").disabled = on; $("stop").disabled = !on; $("lang").disabled = on; }

async function usage() {
  const r = await fetch(API + "/usage"); const u = await r.json();
  $("status").textContent = `오늘 질문 ${u.used} / ${u.limit}`;
}

async function newConversation() {
  const r = await fetch(API + "/conversations", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lang: $("lang").value }) });
  const c = await r.json();
  convId = c.conversation_id; $("log").textContent = ""; add("bot", c.greeting); usage();
}

// SSE 글자 → 이벤트 (트레이닝 v12 frontend-demo 와 같은 규칙: 빈 줄 = 경계)
function* parseSSE(buf) {
  let i;
  while ((i = buf.text.indexOf("\n\n")) >= 0) {
    const chunk = buf.text.slice(0, i); buf.text = buf.text.slice(i + 2);
    const ev = { event: "message", data: "" };
    for (const line of chunk.split("\n")) {
      const c = line.indexOf(":"); if (c <= 0) continue;
      const f = line.slice(0, c), v = line.slice(c + 1).replace(/^ /, "");
      if (f === "event") ev.event = v; else if (f === "data") ev.data += v;
    }
    if (ev.data) yield ev;
  }
}

async function ask(text) {
  if (!convId) await newConversation();
  add("user", text);
  const box = add("bot", "…");
  let started = false;
  ctl = new AbortController(); busy(true);
  try {
    const res = await fetch(`${API}/conversations/${convId}/stream`, { method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, lang: $("lang").value }) });
    if (!res.ok) { box.className = "msg bot error"; box.textContent = `에러 ${res.status}`; return; }
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    const buf = { text: "" };
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf.text += value;
      for (const ev of parseSSE(buf)) {
        const d = JSON.parse(ev.data);
        if (ev.event === "token") { if (!started) { box.textContent = ""; started = true; } box.textContent += d.t; }
        else if (ev.event === "replace") { box.className = "msg bot " + d.outcome; box.textContent = d.text; }
        else if (ev.event === "notice") note(d.text);
        else if (ev.event === "sources") {                  // v2: 근거 안내문 (답보다 먼저 온다)
          const s = document.createElement("div"); s.className = "src";
          s.textContent = "근거: " + d.docs.map((x) => x.title + (x.reviewed ? "" : " (감수 전)")).join(" · ");
          box.after(s);
        }
        else if (ev.event === "done" && d.cached) note("(같은 질문 — 저장된 답)");
      }
      $("log").scrollTop = $("log").scrollHeight;
    }
  } catch (e) {
    if (e.name === "AbortError") { box.textContent = (started ? box.textContent + "  " : "") + "[중지됨]"; }
    else { box.className = "msg bot error"; box.textContent = "연결 실패"; }
  } finally { busy(false); ctl = null; usage(); }
}

$("form").onsubmit = (e) => { e.preventDefault(); const t = $("q").value.trim(); if (!t) return; $("q").value = ""; ask(t); };
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } });
$("stop").onclick = () => ctl?.abort();                 // 연결을 끊으면 서버도 LLM 을 멈춘다
$("newBtn").onclick = newConversation;
$("lang").onchange = newConversation;                   // 언어 바꾸면 새 대화 (단순하게)
$("delBtn").onclick = async () => {
  if (!convId) return;
  await fetch(`${API}/conversations/${convId}`, { method: "DELETE" }); convId = null; $("log").textContent = ""; note("대화를 지웠습니다");
};

(async () => {
  const r = await fetch(API + "/langs"); const l = await r.json();
  for (const x of l.langs) { const o = document.createElement("option"); o.value = x.code; o.textContent = x.name; $("lang").appendChild(o); }
  $("lang").value = l.default; await newConversation();
})();
</script>
</body>
</html>
